<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天平秤秤看</title>
<style>
  /* 注音粉圓（ButTaiwan/bpmfvs，Apache 2.0 / OFL），只保留網站用到的字 */
  @font-face {
    font-family: "BpmfHuninn";
    src: url("fonts/bpmf-huninn-subset.woff2?v=7") format("woff2");
    font-display: swap;
  }
  :root {
    --bg: #fff8e7;
    --card: #ffffff;
    --ink: #4a3b2a;
    --soft: #8a7660;
    --accent: #ff8a3d;
    --accent-dark: #e06a1c;
    --blue: #3b82c4;
    --line: #f0dfc0;
    --zh: "BpmfHuninn", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--zh);
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 12px 16px 32px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  h1 { font-size: 32px; margin: 6px 0; font-weight: normal; }
  .stars { font-size: 20px; font-weight: bold; background: var(--card); border-radius: 999px; padding: 6px 14px; box-shadow: 0 2px 0 var(--line); font-family: sans-serif; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  button {
    font: inherit; border: none; cursor: pointer; border-radius: 14px;
    padding: 8px 14px; font-size: 20px;
    background: var(--card); color: var(--ink); box-shadow: 0 3px 0 var(--line);
    transition: transform .08s;
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
  button.on { background: var(--accent); color: #fff; box-shadow: 0 3px 0 var(--accent-dark); }
  button:disabled { opacity: .45; cursor: default; }
  .lvlabel { font-size: 18px; color: var(--soft); min-width: 64px; }
  .lvbtn { font-size: 18px; padding: 6px 10px; line-height: 1.2; text-align: center; }
  .lvbtn small { display: block; font-size: 12px; opacity: .8; font-family: sans-serif; }
  .lvtitle { font-size: 24px; margin: 4px 2px; }
  .lvdesc { font-size: 18px; color: var(--soft); margin: 0 2px 6px; }
  .msg {
    background: var(--card); border-radius: 18px; padding: 10px 16px; font-size: 22px;
    text-align: center; min-height: 58px; box-shadow: 0 3px 0 var(--line);
  }
  .msg.good { background: #e3f6e5; color: #22702c; }
  .stage { background: linear-gradient(#e8f4ff, #fdf6e8); border-radius: 22px; margin: 10px 0; overflow: hidden; box-shadow: 0 3px 0 var(--line); }
  svg#scale { width: 100%; height: auto; display: block; touch-action: manipulation; }
  .tray-title { color: var(--soft); margin: 10px 2px 4px; font-size: 18px; }
  .tray { display: flex; flex-wrap: wrap; gap: 8px; }
  .wbtn { display: flex; flex-direction: column; align-items: center; padding: 6px 8px 6px; min-width: 72px; }
  .wbtn svg { height: 46px; width: 46px; }
  .wbtn span { font-size: 17px; }
  .obtn { font-size: 30px; padding: 6px 8px; line-height: 1.1; }
  .obtn small { display: block; font-size: 15px; margin-top: 2px; }
  .collect { display: flex; gap: 6px; flex-wrap: wrap; font-size: 28px; }
  .collect span { width: 46px; height: 46px; display: grid; place-items: center; background: var(--card); border-radius: 12px; box-shadow: 0 2px 0 var(--line); cursor: pointer; }
  .collect span.locked { filter: grayscale(1) opacity(.3); }
  .collect span.now { outline: 3px solid var(--accent); }
  .modal-bg { position: fixed; inset: 0; background: rgba(60,40,20,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal-bg.show { display: flex; }
  .modal { background: var(--card); border-radius: 24px; padding: 18px; max-width: 460px; width: 100%; text-align: center; animation: pop .25s ease-out; max-height: 96vh; overflow: auto; }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal .big { font-size: 72px; line-height: 1.1; }
  .modal h2 { margin: 6px 0; font-size: 28px; font-weight: normal; }
  .modal p { font-size: 21px; line-height: 1.7; margin: 8px 0; }
  .sum { font-size: 24px; font-weight: bold; color: var(--blue); word-break: break-all; }
  .choices { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  .choices button { font-size: 22px; min-width: 110px; }
  .choices button.wrong { background: #ffd9d9; animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .speak { background: #eef5ff; }
  .tip { font-size: 19px; color: var(--soft); margin-top: 14px; line-height: 1.8; }
  .confetti { position: fixed; top: -20px; font-size: 26px; pointer-events: none; z-index: 20; animation: fall 1.8s linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
  @media (max-width: 520px) {
    h1 { font-size: 26px; }
    .msg { font-size: 19px; }
    button { font-size: 17px; padding: 7px 10px; }
    .lvbtn { font-size: 16px; padding: 5px 8px; }
    .wbtn { min-width: 60px; }
    .wbtn svg { height: 38px; width: 38px; }
    .wbtn span { font-size: 15px; }
    .tip { font-size: 17px; }
  }
</style>
</head>

(() => {
  const NEUTRAL = "\u{E01E1}";
  const RULES = ["鑰匙", "盤子", "襪子", "東西", "椰子", "下子"].map(w =>
    [new RegExp(`(${w[0]})(${w[1]})(?![\\u{E01E0}-\\u{E01EF}])`, "gu"), `$1$2${NEUTRAL}`]);
  const fix = node => {
    if (node.nodeType === 3) {
      let t = node.nodeValue, n = t;
      for (const [re, rep] of RULES) n = n.replace(re, rep);
      if (n !== t) node.nodeValue = n;
    } else if (node.nodeType === 1 && node.tagName !== "SCRIPT" && node.tagName !== "STYLE") {
      node.childNodes.forEach(fix);
    }
  };
  fix(document.body);
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "characterData") fix(m.target);
    m.addedNodes.forEach(fix);
  })).observe(document.body, { childList: true, subtree: true, characterData: true });
})();

  const CATS = [
    { icon: "🍎", name: "水果", list: ["草莓", "蘋果", "芒果", "水梨", "椰子", "鳳梨", "小玉西瓜", "大西瓜"] },
    { icon: "🐾", name: "動物", list: ["麻雀", "青蛙", "倉鼠", "領角鴞", "松鼠", "刺蝟", "母雞", "兔子", "貓咪", "小狗"] },
    { icon: "🥕", name: "食物", list: ["糖果", "餅乾", "水餃", "吐司", "巧克力", "雞蛋", "紅蘿蔔", "雞腿", "飯糰", "白飯", "果汁", "地瓜", "珍珠奶茶", "一瓶牛奶"] },
    { icon: "🎒", name: "用品", list: ["迴紋針", "蠟筆", "鉛筆", "鑰匙", "牙刷", "襪子", "剪刀", "網球", "肥皂", "手機", "泰迪熊", "運動鞋", "故事書", "雨傘", "筆電", "書包"] },
    { icon: "🚗", name: "交通工具", list: ["滑板", "滑板車", "腳踏車", "機車", "汽車"] },
  ];
  const ALL_ITEMS = [];
  LEVELS.forEach(l => l.items.forEach(it => { if (!it.c && !ALL_ITEMS.some(x => x.n === it.n)) ALL_ITEMS.push(it); }));
  ALL_ITEMS.push(...EXTRA_ITEMS);
  const FREE_GROUPS = CATS.map(c => ({ icon: c.icon, name: c.name, items: c.list.map(n => ALL_ITEMS.find(x => x.n === n)).filter(Boolean) }));
  const others = ALL_ITEMS.filter(it => !CATS.some(c => c.list.includes(it.n)));
  if (others.length) FREE_GROUPS.push({ icon: "📦", name: "其他", items: others });
  const MAX_ON_PAN = 16;

  // ---------- 狀態 ----------
  const SAVE_KEY = "balance-game-v1";
  let save = { stars: 0, done: {}, sound: true };
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = Object.assign(save, s); } catch (e) {}
  // 只保留現在還存在的關卡紀錄，星星數 = 完成的數量
  {
    const valid = new Set(LEVELS.flatMap(l => l.items.map(it => `${l.id}:${it.n}`)));
    for (const k of Object.keys(save.done)) if (!valid.has(k)) delete save.done[k];
    save.stars = Object.keys(save.done).length;
  }
  const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

  let mode = "challenge";
  let levelIdx = 0, itemIdx = 0;
  let pickSide = "R";
  let left = [], right = [];   // {type:'w', g} | {type:'o', item}
  let locked = false;
  let angle = 0, vel = 0, target = 0, animating = false;

  const $ = id => document.getElementById(id);
  const svgNS = "http://www.w3.org/2000/svg";

  // ---------- 單位 ----------
  const isKg = g => g >= 1000;
  function wLabel(g) { return isKg(g) ? `${g / 1000} 公斤` : `${g} 克`; }
  function fmt(g, unit) {
    if (unit === "公斤") return `${g / 1000} 公斤`;
    if ((mode === "free" || unit === "auto") && g >= 1000) {
      const kg = Math.floor(g / 1000), r = g % 1000;
      return `${kg} 公斤` + (r ? ` ${r} 克` : "");
    }
    return `${g} 克`;
  }

  // ---------- 聲音 ----------
  let actx;
  function beep(freq, dur = 0.12, type = "sine", vol = 0.15, delay = 0) {
    if (!save.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime + delay;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(actx.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  const clink = heavy => heavy ? (beep(500, 0.15, "triangle", 0.15), beep(800, 0.12, "sine", 0.06, 0.03))
                               : (beep(1400, 0.08, "triangle", 0.12), beep(2100, 0.1, "sine", 0.06, 0.03));
  const pop = () => beep(500, 0.08, "sine", 0.12);
  const yay = () => [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.22, "triangle", 0.15, i * 0.11));
  const oops = () => { beep(300, 0.15, "square", 0.06); beep(220, 0.2, "square", 0.06, 0.12); };
  function say(text) {
    if (!save.sound || !window.speechSynthesis) return;
    try {
      speechSynthesis.cancel();
      // 語音引擎常把「多重」唸成 ㄔㄨㄥˊ；這個遊戲裡的「重」都唸 ㄓㄨㄥˋ，所以換成同音的「眾」來唸
      const u = new SpeechSynthesisUtterance(text.replace(/[^\p{L}\p{N}，。！？、 ]/gu, "").replace(/重/g, "眾"));
      u.lang = "zh-TW"; u.rate = 0.95;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  // ---------- 畫砝碼 ----------
  const weightSize = g => Math.min(52, 20 + ALL_WEIGHTS.indexOf(g) * 2.4);
  function drawWeight(parent, g, x, y, w) {
    const h = w * 1.05, kg = isKg(g);
    const fill = kg ? "url(#iron)" : "url(#gold)", stroke = kg ? "#3d4852" : "#9a6510";
    const label = kg ? `${g / 1000}kg` : `${g}`;
    const fs = Math.max(10, Math.min(w * 0.36, w * 1.6 / label.length));
    const grp = document.createElementNS(svgNS, "g");
    grp.setAttribute("transform", `translate(${x},${y})`);
    grp.innerHTML = `
      <rect x="${-w * 0.14}" y="${-h - w * 0.22}" width="${w * 0.28}" height="${w * 0.16}" rx="${w * 0.05}" fill="${stroke}"/>
      <circle cx="0" cy="${-h - w * 0.24}" r="${w * 0.17}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>
      <path d="M${-w * 0.4},${-h} L${w * 0.4},${-h} Q${w * 0.5},${-h} ${w * 0.5},${-h + 6} L${w * 0.5},-3 Q${w * 0.5},0 ${w * 0.45},0 L${-w * 0.45},0 Q${-w * 0.5},0 ${-w * 0.5},-3 L${-w * 0.5},${-h + 6} Q${-w * 0.5},${-h} ${-w * 0.4},${-h} Z"
        fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>
      <text x="0" y="${-h / 2 + fs * 0.36}" text-anchor="middle" font-family="Arial, sans-serif" font-size="${fs}" font-weight="bold" fill="${kg ? "#1f2830" : "#5a3a06"}">${label}</text>`;
    parent.appendChild(grp);
    return grp;
  }
  function weightIcon(g) {
    const s = document.createElementNS(svgNS, "svg");
    s.setAttribute("viewBox", "-26 -54 52 56");
    drawWeight(s, g, 0, 0, Math.min(18 + ALL_WEIGHTS.indexOf(g) * 2.4, 46));
    return s;
  }

  // ---------- 盤子內容排列 ----------
  function sizeOf(it) {
    if (it.type === "w") { const w = weightSize(it.g); return { w: w + 2, h: w * 1.47 }; }
    const many = left.filter(x => x.type === "o").length > 1 || right.filter(x => x.type === "o").length > 1;
    const s = mode === "challenge" && !many ? 70 : 44;
    return { w: s, h: s };
  }
  function drawPan(gId, items, endX, endY) {
    const g = $(gId);
    g.setAttribute("transform", `translate(${endX},${endY})`);
    g.innerHTML = `
      <line x1="0" y1="0" x2="-78" y2="108" stroke="#7d8a96" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="78" y2="108" stroke="#7d8a96" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="0" y2="108" stroke="#7d8a96" stroke-width="2" opacity=".6"/>
      <circle cx="0" cy="0" r="5" fill="#9a6510"/>
      <path d="M-90,106 L90,106 Q84,128 60,132 L-60,132 Q-84,128 -90,106 Z" fill="url(#panFill)" stroke="#6f7f8e" stroke-width="2.5"/>`;
    const content = document.createElementNS(svgNS, "g");
    g.appendChild(content);
    const maxW = 170;
    const rows = []; let cur = [], curW = 0;
    const sorted = items.map((it, i) => ({ it, i, ...sizeOf(it) }))
      .sort((a, b) => (b.it.type === "o") - (a.it.type === "o") || b.w - a.w);
    for (const s of sorted) {
      if (curW + s.w > maxW && cur.length) { rows.push(cur); cur = []; curW = 0; }
      cur.push(s); curW += s.w;
    }
    if (cur.length) rows.push(cur);
    let baseY = 106;
    const showQ = mode === "challenge" && gId === "panL";
    for (const row of rows) {
      const rw = row.reduce((a, s) => a + s.w, 0);
      let x = -rw / 2, rh = 0;
      for (const s of row) {
        const cx = x + s.w / 2;
        let el;
        if (s.it.type === "w") {
          el = drawWeight(content, s.it.g, cx, baseY, s.w - 2);
        } else {
          el = document.createElementNS(svgNS, "g");
          el.innerHTML = `<text x="${cx}" y="${baseY - s.h * 0.12}" text-anchor="middle" font-family="sans-serif" font-size="${s.h * 0.92}">${s.it.item.e}</text>`;
          content.appendChild(el);
        }
        el.style.cursor = "pointer";
        el.addEventListener("click", ev => { ev.stopPropagation(); removeFrom(gId === "panL" ? "L" : "R", s.i); });
        x += s.w; rh = Math.max(rh, s.h);
      }
      baseY -= rh - 2;
    }
    if (showQ && items.length) {
      const q = document.createElementNS(svgNS, "g");
      q.setAttribute("transform", `translate(62,${Math.max(baseY + 10, 30)})`);
      q.innerHTML = `<circle r="15" fill="#ff8a3d" stroke="#fff" stroke-width="3"/><text y="7" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#fff">?</text>`;
      content.appendChild(q);
    }
  }

  // ---------- 重量和傾斜 ----------
  const massOf = arr => arr.reduce((a, it) => a + (it.type === "w" ? it.g : it.item.g), 0);
  const wsum = arr => arr.filter(it => it.type === "w").reduce((a, it) => a + it.g, 0);
  const wcount = arr => arr.filter(it => it.type === "w").length;

  function computeTarget() {
    const L = massOf(left), R = massOf(right);
    const d = R - L;
    if (d === 0) return 0;
    const ratio = Math.min(1, Math.abs(d) / Math.max(L, R) * 2);
    return Math.sign(d) * (6 + 12 * ratio);
  }

  function render() {
    const a = angle * Math.PI / 180, arm = 180;
    $("beam").setAttribute("transform", `rotate(${angle} 300 120)`);
    drawPan("panL", left, 300 - arm * Math.cos(a), 120 - arm * Math.sin(a));
    drawPan("panR", right, 300 + arm * Math.cos(a), 120 + arm * Math.sin(a));
    const lw = wsum(left), rw = wsum(right);
    const unit = mode === "challenge" ? curLevel().unit : null;
    $("labelL").textContent = mode === "free" && lw ? `砝碼 ${fmt(lw)}` : "左邊";
    let r = rw ? `砝碼 ${fmt(rw, unit)}` : "右邊";
    if (mode === "challenge" && curLevel().minimal) r += `（${wcount(right)}／${limit()} 個）`;
    $("labelR").textContent = r;
  }

  function tick() {
    vel += (target - angle) * 0.06;
    vel *= 0.86;
    angle += vel;
    if (Math.abs(target - angle) < 0.02 && Math.abs(vel) < 0.02) { angle = target; vel = 0; animating = false; render(); return; }
    render();
    requestAnimationFrame(tick);
  }
  function update() {
    target = computeTarget();
    if (!animating) { animating = true; requestAnimationFrame(tick); }
    render();
    updateMsg();
  }

  // ---------- 訊息 ----------
  let balanceTimer = null;
  function setMsg(t, good) { const m = $("msg"); m.textContent = t; m.classList.toggle("good", !!good); }
  function itemTitle(it) { return it.c ? `${it.c}${it.m}${it.n}` : it.n; }
  function updateMsg() {
    clearTimeout(balanceTimer);
    const L = massOf(left), R = massOf(right);
    if (mode === "challenge") {
      const it = curItem(), lv = curLevel();
      if (!right.length) {
        if (lv.minimal) return setMsg(`${it.e} 這一關最多只能用 ${limit()} 個砝碼，先放大的砝碼試試看！`);
        return setMsg(`${it.e} ${itemTitle(it)}有多重呢？把砝碼放到右邊的盤子試試看！`);
      }
      if (R < L) return setMsg("右邊翹起來了 ⬆️ 砝碼太輕，再加一些砝碼！");
      if (R > L) return setMsg("右邊沉下去了 ⬇️ 砝碼太重，拿掉一些砝碼！");
      setMsg("🎉 平衡了！兩邊一樣重！", true);
      locked = true;
      balanceTimer = setTimeout(askSum, 1100);
    } else {
      freeMsg(L, R);
    }
  }

  // ---------- 自由秤的活潑提示 ----------
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  // 這一邊叫什麼名字：只有一種東西就說它的名字
  function sideName(arr, side) {
    const objs = arr.filter(x => x.type === "o"), hasW = arr.some(x => x.type === "w");
    const names = [...new Set(objs.map(x => x.item.n))];
    if (!objs.length) return "砝碼";
    if (names.length === 1 && !hasW) {
      const it = objs[0].item;
      return objs.length > 1 ? `好幾個${it.e}${it.n}` : `${it.e}${it.n}`;
    }
    return side === "L" ? "左邊的東西" : "右邊的東西";
  }
  let freeSpeakTimer = null;
  function freeMsg(L, R) {
    let t, good = false;
    if (!left.length && !right.length) {
      t = pick([
        "🥊 重量大對決！把東西放到兩邊，看誰比較重！",
        "👀 誰比較重呢？放上去比比看就知道！",
        "⚖️ 天平準備好了，快來放東西吧！",
      ]);
    } else if (!left.length || !right.length) {
      const arr = left.length ? left : right, nm = sideName(arr, left.length ? "L" : "R");
      t = pick([
        `${nm}坐上天平了！另一邊要請誰來比賽呢？`,
        `咚！${nm}把盤子壓下去了，另一邊空空的好寂寞 😢`,
        `${nm}說：「有沒有人要來跟我比重量呀？」`,
      ]);
    } else {
      const heavy = R > L ? sideName(right, "R") : sideName(left, "L");
      const light = R > L ? sideName(left, "L") : sideName(right, "R");
      const ratio = Math.max(L, R) / Math.min(L, R);
      if (L === R) {
        good = true; yay();
        t = pick([
          `🎉 平衡了！${sideName(left, "L")}和${sideName(right, "R")}一樣重，你好厲害！`,
          "⚖️ 剛剛好！兩邊一樣重，紅色指針站直直的！",
          "🌟 哇！一模一樣重，天平穩穩的不動了！",
        ]);
      } else if (ratio >= 5) {
        t = pick([
          `😲 哇！${heavy}比${light}重好多好多，${light}被翹到天上去了 🚀`,
          `💪 ${heavy}是大力士！${light}一下子就被比下去了！`,
          `🐘 ${heavy}好重，像大象一樣；${light}好輕，像羽毛一樣 🪶`,
        ]);
      } else if (ratio >= 1.2) {
        t = pick([
          `咚～${heavy}比較重，沉下去了！${light}輕輕的翹起來 🎈`,
          `⬇️ ${heavy}贏了！${light}再加油一點點！`,
          `${heavy}比較重喔！要不要幫${light}加一些砝碼？`,
        ]);
      } else {
        t = pick([
          `🤏 好接近喔！${heavy}只重了一點點，再加一點點試試看！`,
          `差一點點就平衡了！${light}再加一個小砝碼看看？`,
          `😮 快要一樣重了！${heavy}只比${light}重一咪咪！`,
        ]);
      }
    }
    setMsg(t, good);
    // 小朋友停下來之後再唸，不會一直吵
    clearTimeout(freeSpeakTimer);
    freeSpeakTimer = setTimeout(() => say(t), 700);
  }

  // ---------- 操作 ----------
  function addTo(side, it) {
    if (locked) return;
    const arr = side === "L" ? left : right;
    if (arr.length >= MAX_ON_PAN) { setMsg("盤子滿了！先拿掉一些吧。"); oops(); return; }
    if (mode === "challenge" && curLevel().minimal && it.type === "w" && wcount(right) >= limit()) {
      setMsg(`最多只能用 ${limit()} 個砝碼喔！拿掉小的，換大一點的試試看。`); oops(); return;
    }
    arr.push(it);
    it.type === "w" ? clink(isKg(it.g)) : pop();
    update();
  }
  function removeFrom(side, i) {
    if (locked) return;
    if (mode === "challenge" && side === "L") return;
    (side === "L" ? left : right).splice(i, 1);
    pop();
    update();
  }
  $("clearBtn").onclick = () => {
    if (locked) return;
    right = [];
    if (mode === "free") left = [];
    pop(); update();
  };

  // ---------- 挑戰模式 ----------
  const curLevel = () => LEVELS[levelIdx];
  const curItem = () => curLevel().items[itemIdx];
  const total = it => it.g * (it.c || 1);
  const key = (l, i) => `${LEVELS[l].id}:${LEVELS[l].items[i].n}`;
  // 最少要幾個砝碼（由大到小拿，這套砝碼這樣拿就是最少）
  function limit() {
    let rest = total(curItem()), n = 0;
    for (const w of [...curLevel().weights].sort((a, b) => b - a)) { n += Math.floor(rest / w); rest %= w; }
    return n;
  }
  const firstUndone = l => { const k = LEVELS[l].items.findIndex((_, j) => !save.done[key(l, j)]); return k < 0 ? 0 : k; };

  function buildLevels() {
    const box = $("levels"); box.innerHTML = "";
    LEVELS.forEach((lv, i) => {
      const n = lv.items.filter((_, j) => save.done[key(i, j)]).length;
      const b = document.createElement("button");
      b.className = "lvbtn" + (i === levelIdx ? " on" : "");
      b.innerHTML = `${lv.icon} ${i + 1}<small>${n === lv.items.length ? "🏆" : `${n}/${lv.items.length}`}</small>`;
      b.title = lv.name;
      b.onclick = () => { levelIdx = i; itemIdx = firstUndone(i); startItem(); };
      box.appendChild(b);
    });
    $("lvTitle").textContent = `${curLevel().icon} ${curLevel().name}`;
    $("lvDesc").textContent = curLevel().desc;
    const c = $("collect"); c.innerHTML = "";
    curLevel().items.forEach((it, j) => {
      const s = document.createElement("span");
      const done = save.done[key(levelIdx, j)];
      s.textContent = done ? it.e : "❔";
      s.className = (done ? "" : "locked") + (j === itemIdx ? " now" : "");
      s.title = done ? `${itemTitle(it)} ${fmt(total(it), curLevel().unit)}` : "還沒秤過";
      s.onclick = () => { itemIdx = j; startItem(); };
      c.appendChild(s);
    });
  }

  function buildWeightTray() {
    const tray = $("weightTray"); tray.innerHTML = "";
    const ws = mode === "challenge" ? curLevel().weights : FREE_WEIGHTS;
    ws.forEach(g => {
      const b = document.createElement("button");
      b.className = "wbtn";
      b.appendChild(weightIcon(g));
      const sp = document.createElement("span"); sp.textContent = wLabel(g);
      b.appendChild(sp);
      b.onclick = () => addTo(mode === "challenge" ? "R" : pickSide, { type: "w", g });
      tray.appendChild(b);
    });
  }
  let freeGroup = 0;
  function buildObjTray() {
    const tabs = $("objTabs"); tabs.innerHTML = "";
    FREE_GROUPS.forEach((gr, i) => {
      const b = document.createElement("button");
      b.className = "lvbtn" + (i === freeGroup ? " on" : "");
      b.textContent = `${gr.icon} ${gr.name}`;
      b.onclick = () => { freeGroup = i; buildObjTray(); };
      tabs.appendChild(b);
    });
    const tray = $("objTray"); tray.innerHTML = "";
    FREE_GROUPS[freeGroup].items.forEach(item => {
      const b = document.createElement("button");
      b.className = "obtn";
      b.innerHTML = `${item.e}<small>${item.n}</small>`;
      b.onclick = () => addTo(pickSide, { type: "o", item });
      tray.appendChild(b);
    });
  }

  function startItem() {
    locked = false; closeModal(); clearTimeout(balanceTimer);
    const it = curItem();
    left = Array.from({ length: it.c || 1 }, () => ({ type: "o", item: it }));
    right = [];
    buildLevels(); buildWeightTray();
    update();
    say(`${itemTitle(it)}有多重呢？`);
  }

  // ---------- 加法問題 ----------
  function askSum() {
    const it = curItem(), unit = curLevel().unit;
    const ws = right.map(r => r.g).sort((a, b) => b - a);
    const ans = ws.reduce((a, b) => a + b, 0);
    const opts = new Set([ans]);
    const steps = [ws[ws.length - 1], ...curLevel().weights.slice(0, 3)];
    let guard = 0;
    while (opts.size < 3 && guard++ < 60) {
      const d = steps[Math.floor(Math.random() * steps.length)] * (Math.random() < .5 ? -1 : 1);
      if (ans + d > 0) opts.add(ans + d);
    }
    const list = [...opts].sort(() => Math.random() - .5);
    const show = g => unit === "公斤" ? g / 1000 : unit === "auto" ? wLabel(g) : g;
    yay();
    showModal(`
      <div class="big">⚖️</div>
      <h2>平衡了！</h2>
      <p>右邊的砝碼加起來是多少呢？</p>
      <div class="sum">${ws.map(show).join(" + ")} = ？</div>
      <div class="choices">${list.map(v => `<button data-v="${v}">${fmt(v, unit)}</button>`).join("")}</div>
    `);
    say("平衡了！右邊的砝碼加起來是多少呢？");
    $("modal").querySelectorAll(".choices button").forEach(b => b.onclick = () => {
      if (+b.dataset.v === ans) reveal(it, ans, ws.length);
      else { b.classList.add("wrong"); b.disabled = true; oops(); say("再算一次看看！"); }
    });
  }

  function reveal(it, ans, used) {
    const k = key(levelIdx, itemIdx), unit = curLevel().unit;
    const first = !save.done[k];
    if (first) { save.done[k] = true; save.stars++; persist(); }
    updateStars();
    yay(); confetti();
    const nextIdx = curLevel().items.findIndex((_, j) => !save.done[key(levelIdx, j)]);
    const levelDone = nextIdx < 0;
    const nextLevel = levelDone && levelIdx < LEVELS.length - 1;
    const allDone = LEVELS.every((l, li) => l.items.every((_, j) => save.done[key(li, j)]));
    showModal(`
      <div class="big">${it.c ? it.e.repeat(Math.min(it.c, 5)) : it.e}</div>
      <h2>${itemTitle(it)} = ${fmt(ans, unit)}</h2>
      <p>${it.f}</p>
      ${curLevel().minimal ? `<p>👍 只用了 ${used} 個砝碼，真厲害！</p>` : ""}
      ${first ? "<p>得到一顆 ⭐！</p>" : ""}
      ${allDone && first ? "<p>👑 全部的關卡都過關了，你是天平大師！</p>" : levelDone && first ? "<p>🏆 這一關全部完成了！</p>" : ""}
      <div class="choices">
        <button class="speak" id="speakBtn">🔊 再聽一次</button>
        <button class="on" id="nextBtn">${nextLevel ? "下一關 ➡️" : levelDone ? "再玩一次 🔁" : "下一個 ➡️"}</button>
      </div>
    `);
    say(`答對了！${it.f}`);
    $("speakBtn").onclick = () => say(it.f);
    $("nextBtn").onclick = () => {
      if (nextLevel) { levelIdx++; itemIdx = firstUndone(levelIdx); }
      else if (levelDone) { itemIdx = (itemIdx + 1) % curLevel().items.length; }
      else itemIdx = nextIdx;
      startItem();
    };
  }

  function showModal(html) { $("modal").innerHTML = html; $("modalBg").classList.add("show"); }
  function closeModal() { $("modalBg").classList.remove("show"); }
  function updateStars() { $("stars").textContent = `⭐ ${save.stars}`; }
  function confetti() {
    const pieces = ["🎉", "⭐", "✨", "🎊", "💛"];
    for (let i = 0; i < 24; i++) {
      const s = document.createElement("div");
      s.className = "confetti";
      s.textContent = pieces[i % pieces.length];
      s.style.left = Math.random() * 100 + "vw";
      s.style.animationDelay = Math.random() * 0.6 + "s";
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 2600);
    }
  }

  // ---------- 模式切換 ----------
  function setMode(m) {
    mode = m;
    $("modeChallenge").classList.toggle("on", m === "challenge");
    $("modeFree").classList.toggle("on", m === "free");
    $("challengeBar").style.display = m === "challenge" ? "" : "none";
    $("sidePick").style.display = m === "free" ? "" : "none";
    $("objTrayWrap").style.display = m === "free" ? "" : "none";
    clearTimeout(freeSpeakTimer);
    if (m === "challenge") startItem();
    else {
      locked = false; clearTimeout(balanceTimer);
      left = []; right = [];
      buildWeightTray(); buildObjTray(); update();
    }
  }
  $("modeChallenge").onclick = () => setMode("challenge");
  $("modeFree").onclick = () => setMode("free");
  function setPick(s) { pickSide = s; $("pickL").classList.toggle("on", s === "L"); $("pickR").classList.toggle("on", s === "R"); }
  $("pickL").onclick = () => setPick("L");
  $("pickR").onclick = () => setPick("R");
  $("scale").addEventListener("click", ev => {
    if (mode !== "free") return;
    const r = $("scale").getBoundingClientRect();
    setPick(ev.clientX - r.left < r.width / 2 ? "L" : "R");
  });

  function updateSoundBtn() { $("soundBtn").textContent = save.sound ? "🔊" : "🔇"; }
  $("soundBtn").onclick = () => { save.sound = !save.sound; persist(); updateSoundBtn(); if (!save.sound && window.speechSynthesis) speechSynthesis.cancel(); };

  // ---------- 開始 ----------
  updateSoundBtn(); updateStars();
  levelIdx = LEVELS.findIndex((l, li) => l.items.some((_, j) => !save.done[key(li, j)]));
  if (levelIdx < 0) levelIdx = 0;
  itemIdx = firstUndone(levelIdx);
  setMode("challenge");
})();
</script>
</body>
</html>
